[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-indexer"
dynamic = ["version"]
description = "AI-powered semantic code search with local models"
authors = [
    {name = "LightspeedDMS", email = "seba.battig@lightspeeddms.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9,<3.13"
keywords = ["ai", "code-search", "semantic-search", "ollama", "qdrant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pathspec>=0.11.0",
    "watchdog>=3.0.0",
    "jsonschema>=4.0.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.24.0",
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[bcrypt]>=0.2.0",
    "python-multipart>=0.0.6",
    "psutil>=5.9.0,<6.0.0",
    "PyJWT>=2.8.0",
    "numpy>=1.24.0",
    "tokenizers>=0.13.0",
    "GitPython>=3.1.0",
    "zstandard>=0.25.0",
    # Custom hnswlib fork (Story #54) — PyPI version lacks check_integrity().
    # Also carries repair_orphans() (Story #1358 / Epic #1333) — deterministic
    # HNSW orphan repair, GIL-released save_index()/load_index() (Bug #1437),
    # and GIL-released init_index/resize_index/check_integrity/repair_orphans/
    # get_ids_list/get_items/mark_deleted/BFIndex save_index/load_index
    # (Story #1490 / Epic #1489 Finding A1) — native HNSW shard load/save and
    # these remaining bindings no longer block all Python threads for the
    # call's duration. Pinned to same commit as third_party/hnswlib submodule
    # and EXPECTED_HNSWLIB_FORK_COMMIT (hnsw_index_manager.py). Requires
    # gcc/g++ at install time.
    "hnswlib @ git+https://github.com/LightspeedDMS/hnswlib.git@8155cfc9d02a5a46528a3faab697555952ed40c6",
    "regex>=2023.0.0",
    "rpyc>=6.0.0",
    "authlib>=1.6.5",
    "aiosqlite>=0.21.0",
    "aiohttp>=3.8.0",
    "msgpack>=1.0.0",
    "sse-starlette>=1.6.0",
    "itsdangerous>=2.1.0",
    "jinja2>=3.1.0",
    "msgpack>=1.0.0",
    "pysqlite3-binary>=0.5.0; sys_platform == 'linux'",
    "protobuf>=3.20.0",
    "cachetools>=5.0.0",
    "tenacity>=8.0.0",
    "tantivy==0.25.0",
    # OpenTelemetry dependencies (Story #695)
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    # Story #1676 AC5: outbound HTTP span instrumentation for httpx
    # (process-global) -- covers embedding-provider calls (VoyageAI,
    # Cohere) made via HttpClientFactory's pooled client and any other
    # httpx.Client/AsyncClient traffic in the server.
    "opentelemetry-instrumentation-httpx>=0.41b0",
    # Story #1676 AC3: the recommended, non-deprecated replacement for
    # opentelemetry.sdk._logs.LoggingHandler (deprecated as of SDK 1.40).
    # Floor chosen so the resolver picks the exact version pinned to the
    # SAME opentelemetry-instrumentation release already resolved for each
    # supported Python target (verified via `uv lock`: 0.62b1 on the
    # Python 3.9 branch, matching that branch's opentelemetry-instrumentation
    # 0.62b1; a newer 0.6xb0 on the Python 3.10-3.12 branch, matching that
    # branch's opentelemetry-instrumentation release).
    "opentelemetry-instrumentation-logging>=0.51b0",
    # Langfuse LLM observability (Bug #1117) — mandatory so the auto-updater's
    # `pip install -e .` installs it on every node (previously hand-installed on
    # one node only, so telemetry init failed cluster-wide). OTEL-based; verified
    # conflict-free against the existing pins via `pip check` on a node.
    "langfuse>=3.0.0",
    # Markdown rendering for Research Assistant
    "markdown>=3.4.0",
    "bleach>=6.0.0",
    # Wiki front matter parsing
    # Bug #1443: python-frontmatter==1.2.0's util.py imports typing.TypeGuard,
    # which does not exist in the Python 3.9 stdlib (this project's requires-python
    # floor). The wheel declares no Requires-Python guard, so pip happily resolves
    # the unbounded pin to 1.2.0 on 3.9 and `import frontmatter` raises ImportError.
    # Verified: 1.1.0 is the last pre-1.2.0 release, is available on PyPI, and
    # imports + parses correctly on Python 3.9.25 in an isolated venv.
    "python-frontmatter>=1.0.0,<1.2.0 ; python_version < '3.10'",
    "python-frontmatter>=1.0.0 ; python_version >= '3.10'",
    # Excel export for query analytics (Story #1160)
    "openpyxl>=3.1.0",
    # MFA/TOTP dependencies (Epic #556)
    "pyotp>=2.9.0",
    "qrcode>=7.4.0",
    "pillow>=10.0.0",
    # X-Ray AST-aware code search (core since v10.2.1)
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages==1.10.2",
    # Cross-process file locking used by database_manager.py (Bug #1178) and
    # ssh_key_manager.py.  Previously only a transitive dep; now explicit.
    "filelock>=3.12",
]

[project.optional-dependencies]
cluster = [
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
]
cohere = ["cohere>=5.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.28.0",
    # Bug #1552: required by mypy for src/code_indexer/server/omni/omni_cache.py and
    # services/git_operations_service.py. It was installed ad hoc on developer
    # machines but never declared, so ./lint.sh passed locally and failed in any
    # fresh environment (including CI) with "Library stubs not installed".
    "types-cachetools>=5.0.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/LightspeedDMS/code-indexer"
Repository = "https://github.com/LightspeedDMS/code-indexer"
Issues = "https://github.com/LightspeedDMS/code-indexer/issues"

[project.scripts]
code-indexer = "code_indexer.cli_fast_entry:main"
cidx = "code_indexer.cli_fast_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_indexer"]
include = [
    "src/code_indexer/docker/*"
]
exclude = [
    "dist/docker-compose.yml"
]

[tool.hatch.version]
path = "src/code_indexer/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = [
    "tests/fixtures/cidx-test-repo/",
    "tests/manual/"
]

[tool.ruff.lint.per-file-ignores]
# Intentional lazy loading after logger initialization
"src/code_indexer/server/app.py" = ["E402"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_site_packages = false
explicit_package_bases = true
mypy_path = "src"
exclude = [
    "tests/fixtures/cidx-test-repo/.*",
    "tests/manual/.*",
    # Issue #1696 Session 2: these 3 files are deliberate, self-contained
    # dual-import-identity regression probes -- their entire test value
    # depends on retaining a literal `src.code_indexer.*` import statement
    # alongside the bare `code_indexer.*` spelling. This blocks mypy from
    # picking them up as ROOTS during its recursive directory walk of
    # `tests`. It is NOT sufficient by itself -- see the
    # `follow_imports = "skip"` overrides below for the other half.
    "^tests/conftest\\.py$",
    "^tests/unit/cli/test_console_singleton_test_isolation_bug1370\\.py$",
    "^tests/unit/server/models/test_query_result_item_import\\.py$",
]

# Issue #1696 Session 2 (continued): `exclude` above only blocks
# directory-walk ROOT discovery. Each of these 3 files is *also* reachable
# via another (non-excluded) file's import statement (confirmed live for
# tests/conftest.py, which mypy still parsed via import-following even
# while excluded from root discovery), so mypy would still parse its body
# and hit the same "Source file found twice under different module names"
# crash mypy_path (above) exists to fix. `follow_imports = "skip"` stops
# mypy from ever parsing these modules' bodies when reached via import --
# it type-checks them as Any instead -- which structurally cannot collide,
# regardless of how many places import them. Both mechanisms together are
# required; either alone was proven insufficient during this session.
[[tool.mypy.overrides]]
module = "tests.conftest"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.unit.cli.test_console_singleton_test_isolation_bug1370"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.unit.server.models.test_query_result_item_import"
follow_imports = "skip"

# Issue #1696 Session 2: temporary staging for the wave of mypy findings
# newly surfaced by landing `mypy_path = "src"` above (Session 1 eliminated the
# `src.code_indexer.*` import-spelling hazard; Session 2 landed mypy_path and
# measured the real cross-module error count for the first time: 4422 errors
# across these 644 files). Fixing all 4422 is explicitly out of scope for
# Session 2 -- staged here with `ignore_errors = true` so `./lint.sh` stays a
# usable, green gate for everyone else while Session 3+ fixes them module by
# module. REMOVE an entry from this list as soon as its module's errors are
# fixed -- do NOT leave a module here once it is clean, and do NOT add a new
# module to this list to silence a *new* error; fix it instead. This list must
