[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cidx-testkit"
version = "0.1.0"
description = "Seam conformance suites, fakes of remote services and static guards for code-indexer add-ons (dev only)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
# A DEV dependency only: never a runtime dependency of the core or an add-on.
dependencies = [
    "cidx-sdk @ {root:parent:uri}/cidx-sdk",
    "pytest>=7",
    # The ripgrep suite's checks are async (the seam's run() is a coroutine).
    "pytest-asyncio>=0.21",
    "tomli>=1.1; python_version < '3.11'",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cidx_testkit"]
