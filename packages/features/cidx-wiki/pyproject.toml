[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cidx-wiki"
dynamic = ["version"]
description = "The wiki: repository markdown served as browsable articles -- a code-indexer feature add-on"
readme = "README.md"
license = {text = "MIT"}
# Tracks the core's requires-python (see the root pyproject.toml).
requires-python = ">=3.10,<3.13"
# The SDK by path, as the core references it (the name is not ours on public
# indexes). A feature depends on the SDK and third-party packages only --
# never on code-indexer; see src/cidx_wiki/_platform.py for the one
# transitional exception and how it goes away.
dependencies = [
    "cidx-sdk @ {root:parent:parent:uri}/cidx-sdk",
    # Routes, templates and the MCP handler's request plumbing.
    "fastapi>=0.116.0",
    "jinja2>=3.1.0",
    # Article rendering: front matter and markdown.
    "python-frontmatter>=1.0.0",
    "markdown-it-py>=3.0.0",
    "pyyaml>=6.0",
]

[project.entry-points."code_indexer.features"]
wiki = "cidx_wiki.feature:make_feature"

[tool.hatch.version]
path = "src/cidx_wiki/_version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cidx_wiki"]
