name: CI/CD with Auto Release

# ^ why broad triggers, not a second workflow; secret-scan must stay in create-tag needs => other jobs gate via legacy_triggers
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master, main, development, staging ]

permissions:
  contents: write  # Allow creating tags and releases
  actions: read    # Allow reading workflow runs

jobs:
  test:
    # ^ coupled legacy_triggers with lint, rust, check-version (aliases); = the on: set before secret-scan widened it
    if: &legacy_triggers ${{ (github.event_name == 'push' && contains(fromJSON('["refs/heads/master","refs/heads/main","refs/heads/develop","refs/heads/development","refs/heads/staging"]'), github.ref)) || (github.event_name == 'pull_request' && contains(fromJSON('["master","main"]'), github.base_ref)) }}
    #^ why ubuntu-24.04, not ubuntu-latest; latest = 26.04 has no Python 3.9 for setup-python
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python3 -m pip install -e third_party/hnswlib --break-system-packages
        python3 -m pip install -e ".[dev,cluster]" --break-system-packages

    - name: Run server smoke tests
      run: |
        python3 -m pytest tests/unit/server/storage/test_factory.py tests/unit/server/mcp/test_protocol.py tests/unit/services/test_database_health_cluster.py -v --tb=short --deselect=tests/unit/server/storage/test_factory.py::TestSQLiteProtocolSatisfaction::test_dependency_map_tracking_satisfies_protocol

  lint:
    if: *legacy_triggers
    #^ coupled Python 3.9 (mypy python_version) with ubuntu-24.04; ubuntu-latest = 26.04 lacks 3.9
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # MUST be 3.9 -- it is what [tool.mypy] python_version targets in pyproject.toml
    # AND what developers actually run ./lint.sh on locally. Because that config also
    # sets no_site_packages = false, mypy PARSES third-party sources under the 3.9
    # target; a newer interpreter installs modern dependencies (e.g. anyio) that use
    # match statements, which a 3.9 target cannot parse, and the gate dies on
    # site-packages instead of on our code. Verified: a 3.11 lint job failed with
    # "anyio/_core/_tasks.py: Pattern matching is only supported in Python 3.10 and
    # greater" while the identical tree passed locally on 3.9. Keep this in sync with
    # [tool.mypy] python_version.
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python3 -m pip install -e third_party/hnswlib --break-system-packages
        python3 -m pip install -e ".[dev,cluster]" --break-system-packages
        # Pin ruff/mypy to the SAME versions .pre-commit-config.yaml pins and that
        # developers run locally. pyproject's dev extra only FLOORS these
        # (ruff>=0.0.280, mypy>=1.0.0), so an unpinned install here can pick up a
        # newer ruff whose formatter disagrees with the local one and turn this gate
        # red on a locally-clean tree. A flapping gate is worse than no gate.
        # Source of truth for the ruff pin: .pre-commit-config.yaml (keep in sync).
        python3 -m pip install --break-system-packages ruff==0.14.1 mypy==1.18.2

    - name: Run ./lint.sh (ruff check + ruff format check + mypy over src/ and tests/)
      run: ./lint.sh

  # ^ why own job, not inside lint; needs no Python env => runs in parallel and fails under its own name
  # ^ why push range only, not full history; history holds an unresolved finding => full scan stays red
  secret-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # ^ coupled GITLEAKS_VERSION with .pre-commit-config.yaml:gitleaks rev; bump both together
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      TRUFFLEHOG_VERSION: 3.99.2
      TRUFFLEHOG_SHA256: 3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ^ why release tarballs, not gitleaks/gitleaks-action; the action needs a licence key for organisation accounts
    - name: Install pinned gitleaks and trufflehog (sha256-verified)
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/scanners/bin"
        cd "$RUNNER_TEMP/scanners"
        curl -fsSL -o gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
        tar -xzf gitleaks.tar.gz -C bin gitleaks
        curl -fsSL -o trufflehog.tar.gz \
          "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
        echo "${TRUFFLEHOG_SHA256}  trufflehog.tar.gz" | sha256sum -c -
        tar -xzf trufflehog.tar.gz -C bin trufflehog
        echo "$RUNNER_TEMP/scanners/bin" >> "$GITHUB_PATH"

    - name: Determine commit range to scan
      id: range
      env:
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        zero=0000000000000000000000000000000000000000
        # ^ invariant merge-base exit 1 = no common ancestor => empty base (full scan); any other git error fails the step
        merge_base() {
          local rc=0
          git merge-base "$1" "$2" || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ] || { echo "git merge-base $1 $2 failed rc=$rc" >&2; return "$rc"; }
        }
        if [ "$EVENT_NAME" = "pull_request" ]; then
          base="$PR_BASE"; after="$PR_HEAD"
        else
          base="$PUSH_BEFORE"; after="$PUSH_AFTER"
        fi
        # ^ hazard a missing scanned commit => git log of nothing => silent pass; check it exists first
        git cat-file -e "${after}^{commit}"
        if [ "$EVENT_NAME" != "pull_request" ] && { [ -z "$base" ] || [ "$base" = "$zero" ]; }; then
          # New branch: scan only commits not already on the default branch;
          # the default branch's own first push (or unrelated history) scans everything.
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            base=""
          else
            git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH^{commit}" >/dev/null
            base="$(merge_base "$after" "origin/$DEFAULT_BRANCH")"
          fi
        elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
          # Forced push: the old tip is on no ref any more; fetch it by SHA (fails the job if impossible).
          git fetch --no-tags origin "$base"
        fi
        # ^ external trufflehog --since-commit must be an ancestor of --branch, else it scans 0 commits
        if [ -n "$base" ]; then base="$(merge_base "$base" "$after")"; fi
        if [ -n "$base" ]; then log_opts="${base}..${after}"; else log_opts="${after}"; fi
        count="$(git rev-list --count "$log_opts")"
        echo "Scanning ${count} commit(s): $log_opts"
        {
          echo "base=$base"
          echo "after=$after"
          echo "log_opts=$log_opts"
        } >> "$GITHUB_OUTPUT"

    # ^ hazard dropping --diff-merges=first-parent => git log -p omits merge diffs => secret added in conflict resolution passes
    # ^ security file paths can carry secrets => public log gets rule, commit and line only; never --verbose
    - name: gitleaks (pushed commits incl. merge diffs, redacted)
      env:
        LOG_OPTS: ${{ steps.range.outputs.log_opts }}
      run: |
        set -euo pipefail
        report="$RUNNER_TEMP/gitleaks.json"
        rc=0
        gitleaks git --no-banner --redact --config .gitleaks.toml \
          --log-opts="--diff-merges=first-parent $LOG_OPTS" -f json -r "$report" . || rc=$?
        if [ -s "$report" ]; then
          jq -r '.[] | "FINDING gitleaks rule=\(.RuleID) commit=\(.Commit) line=\(.StartLine) (path withheld; run gitleaks locally)"' "$report"
        fi
        exit "$rc"

    # ^ external trufflehog verification calls each detected credential's provider or host => outbound network calls from CI
    # ^ security plain output prints raw values and file paths can carry secrets => public log gets detector, commit, line only
    - name: trufflehog (pushed commits, verified-live credentials only)
      if: ${{ !cancelled() && steps.range.outcome == 'success' }}
      env:
        BASE: ${{ steps.range.outputs.base }}
        AFTER: ${{ steps.range.outputs.after }}
      run: |
        set -euo pipefail
        trufflehog git "file://$GITHUB_WORKSPACE" --branch "$AFTER" ${BASE:+--since-commit "$BASE"} \
          --only-verified --fail --fail-on-scan-errors --no-update --json \
          | jq -r '"FINDING trufflehog detector=\(.DetectorName) commit=\(.SourceMetadata.Data.Git.commit // "-") line=\(.SourceMetadata.Data.Git.line // "-") (path withheld; run trufflehog locally)"'

  # Before this job existed, NO gate anywhere (local or CI) ran `cargo test` or
  # `cargo clippy` -- the entire 447-test Rust suite under rust/ (xray-core,
  # xray-cli), including the AC18 structural-parity check
  # (rust/xray-core/src/preamble_ac18_parity.rs) that is the only guard against
  # a repeat of Bug #1795's memory-unsafe PREAMBLE/type divergence, was executed
  # only by a human running cargo manually. This is its own job (not folded into
  # `lint`/`test`) so a Rust toolchain install and cargo cache don't slow down
  # the Python jobs' matrix, and it gates create-tag/create-release below
  # exactly like `lint` and `test` already do.
  rust:
    if: *legacy_triggers
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # Pinned to an exact version (1.98.0), not the floating `@stable` tag.
    # dtolnay/rust-toolchain@stable installs whatever "stable" resolves to on
    # the day the job runs, which drifts ahead of every developer's local
    # toolchain -- exactly the ruff/mypy pinning problem documented in
    # CLAUDE.md's "Lint and CI" section (pyproject's dev extra only FLOORS
    # those versions), just via a floating GitHub Action instead of an
    # unpinned pip install. This action does NOT read rust-toolchain.toml
    # itself (verified: its action.yml has no such logic -- it is driven
    # purely by the `toolchain` input baked into the git ref); rust/
    # rust-toolchain.toml is the separate LOCAL-side pin that rustup's own
    # override mechanism picks up for `cargo`/`cargo clippy` invocations
    # inside rust/, in CI and on developer machines alike. Keep this version
    # in sync with rust/rust-toolchain.toml's `channel` -- both must name the
    # same version or CI and local can drift apart again.
    - name: Install Rust toolchain (1.98.0 + clippy)
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: clippy

    # Caches the cargo registry/git checkouts and the rust/target build
    # artifacts, keyed on rust/Cargo.lock (Swatinem/rust-cache handles cache
    # key/pruning automatically) -- keeps this job's cold-build cost off the
    # critical path on every push after the first.
    - name: Cache cargo registry and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "rust -> target"

    #^ why --locked => lockfile drift fails here, not at deploy (auto-updater builds --locked)
    - name: Run cargo test --locked --workspace (rust/xray-core + rust/xray-cli, incl. AC18 PREAMBLE parity check)
      working-directory: rust
      run: cargo test --locked --workspace

    - name: Run cargo clippy --locked --workspace --all-targets -- -D warnings
      working-directory: rust
      run: cargo clippy --locked --workspace --all-targets -- -D warnings

  check-version:
    if: *legacy_triggers
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      current_version: ${{ steps.check_version.outputs.current_version }}
      previous_version: ${{ steps.check_version.outputs.previous_version }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Get current version
      id: get_version
      run: |
        echo "current_version=$(python3 -c "import sys; sys.path.insert(0, 'src'); from code_indexer import __version__; print(__version__)")" >> $GITHUB_OUTPUT

    - name: Check if version file changed
      run: |
        if git diff --name-only HEAD~1 HEAD | grep -q "src/code_indexer/__init__.py"; then
          echo "version_file_changed=true" >> $GITHUB_ENV
        else
          echo "version_file_changed=false" >> $GITHUB_ENV
        fi

    - name: Get previous version
      if: env.version_file_changed == 'true'
      run: |
        echo "previous_version=$(git show HEAD~1:src/code_indexer/__init__.py | grep '__version__' | cut -d'\"' -f2)" >> $GITHUB_ENV

    - name: Check if version changed
      id: check_version
      run: |
        current_version="${{ steps.get_version.outputs.current_version }}"
        echo "current_version=$current_version" >> $GITHUB_OUTPUT

        if [ "${{ env.version_file_changed }}" = "true" ]; then
          previous_version="${{ env.previous_version }}"
          echo "previous_version=$previous_version" >> $GITHUB_OUTPUT

          if [ "$current_version" != "$previous_version" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "Version changed from $previous_version to $current_version"
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "Version file modified but version unchanged: $current_version"
          fi
        else
          echo "version_changed=false" >> $GITHUB_OUTPUT
          echo "Version file not modified: $current_version"
        fi

  create-tag:
    runs-on: ubuntu-latest
    # Bug #1552: the tag is what triggers the staging auto-deploy, so it must NOT be
    # cut from a tree that failed lint or tests. Previously this needed only
    # check-version, so a red `test` job still produced a tag and a green-looking
    # release. If lint/test go red no tag is created and staging will not deploy
    # until the failure is fixed -- that is the intended semantics of a gate.
    needs: [check-version, lint, test, rust, secret-scan]
    if: |
      needs.check-version.outputs.version_changed == 'true' &&
      github.ref == 'refs/heads/development'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Create and Push Tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Extract version
        VERSION="${{ needs.check-version.outputs.current_version }}"

        # Check if tag already exists on remote (pushed manually)
        if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "v$VERSION"; then
          echo "Tag v$VERSION already exists on remote -- skipping creation"
          exit 0
        fi

        # Create git tag
        git config user.name github-actions
        git config user.email github-actions@github.com
        git tag "v$VERSION" -m "Release version $VERSION"
        git push origin "v$VERSION"

        echo "Created and pushed tag v$VERSION from development branch"

  create-release:
    runs-on: ubuntu-latest
    # Bug #1552: a production release must not be publishable from a tree that
    # failed lint or tests (see the create-tag rationale above).
    needs: [check-version, lint, test, rust, secret-scan]
    if: |
      needs.check-version.outputs.version_changed == 'true' &&
      github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python3 -m pip install build twine --break-system-packages

    - name: Build package
      run: |
        python3 -m build

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Extract version
        VERSION="${{ needs.check-version.outputs.current_version }}"

        # Check if release already exists (created from prior branch push)
        if gh release view "v$VERSION" &>/dev/null; then
          echo "Release v$VERSION already exists -- uploading dist artifacts only"
          gh release upload "v$VERSION" dist/* --clobber || true
          exit 0
        fi

        # Create GitHub release with auto-generated notes using existing tag
        gh release create "v$VERSION" \
          --title "Release v$VERSION" \
          --generate-notes \
          --draft=false \
          --prerelease=false \
          dist/*

        echo "Created GitHub release v$VERSION from master branch"
