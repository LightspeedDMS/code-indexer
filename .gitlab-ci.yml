# cidx (code-indexer-internal) — build the deployable EKS server image and push to ECR.
#
# Mirrors the proven tools-v2 Docker cross-account pattern (ci-templates
# node-tools-v2-docker-template.yml) but is pure-Python: no Stage-role assume / no
# CodeArtifact .npmrc (cidx installs from public PyPI + the vendored third_party/hnswlib).
#
# The docker-autoscaler runner's identity is the shared tools ECR-home account
# (601706661779 — the registry that hosts ALL tools-* images across test/validate/live),
# resolved dynamically via `aws sts get-caller-identity`. eks-test-tools-uswest2 lives in
# tools-test (124169034092) and pulls cross-account from this shared ECR home (the standard
# tools-* pattern; the repo policy + node role already allow it).
#
# Produces (in the shared "gitlab-runner" ECR repo, keyed by the cidx- tag prefix):
#   601706661779.dkr.ecr.us-west-2.amazonaws.com/gitlab-runner:cidx-<version>-<sha>  (immutable)
#   601706661779.dkr.ecr.us-west-2.amazonaws.com/gitlab-runner:cidx-tools-latest      (moving — the tag the live cidx Deployment pulls)

stages:
  - build

variables:
  ECR_REGION: "us-west-2"
  # Tools convention: ONE shared ECR repo "gitlab-runner" keyed by tag PREFIX
  # (cidx-tools-latest, agent-router-tools-latest, ...). This is the repo the live
  # cidx Deployment pulls: 601706661779.../gitlab-runner:cidx-tools-latest.
  ECR_REPOSITORY_NAME: "gitlab-runner"
  IMAGE_PREFIX: "cidx"

Build and Push cidx Image:
  stage: build
  tags:
    - default
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  resource_group: docker-deploy/tools
  environment:
    name: tools
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
  before_script:
    - apk upgrade --no-cache libexpat
    - apk add --no-cache aws-cli jq
    - unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
    - until docker info; do sleep 2; done
  script:
    - |
      set -euo pipefail
      ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      ECR_REPOSITORY="${ACCOUNT_ID}.dkr.ecr.${ECR_REGION}.amazonaws.com/${ECR_REPOSITORY_NAME}"

      echo "Logging in to ECR ${ACCOUNT_ID}.dkr.ecr.${ECR_REGION}.amazonaws.com ..."
      aws ecr get-login-password --region "$ECR_REGION" | \
        docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${ECR_REGION}.amazonaws.com"

      VERSION=$(TZ=America/Denver date +"%Y.%m.%d.%H%M")
      SHORT_SHA=$(echo "$CI_COMMIT_SHORT_SHA" | cut -c1-7)
      IMAGE_TAG="${IMAGE_PREFIX}-${VERSION}-${SHORT_SHA}"
      FULL_IMAGE_TAG="${ECR_REPOSITORY}:${IMAGE_TAG}"
      LATEST_TAG="${IMAGE_PREFIX}-tools-latest"

      echo "Building ${FULL_IMAGE_TAG} ..."
      DOCKER_BUILDKIT=1 docker build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t "$FULL_IMAGE_TAG" .

      docker push "$FULL_IMAGE_TAG"
      echo "Pushed ${FULL_IMAGE_TAG}"

      # Move the ${IMAGE_PREFIX}-tools-latest tag to this build via manifest copy (no re-pull).
      MANIFEST=$(aws ecr batch-get-image \
        --repository-name "$ECR_REPOSITORY_NAME" \
        --image-ids imageTag="$IMAGE_TAG" \
        --region "$ECR_REGION" \
        --query 'images[0].imageManifest' --output text)
      aws ecr batch-delete-image \
        --repository-name "$ECR_REPOSITORY_NAME" \
        --image-ids imageTag="$LATEST_TAG" \
        --region "$ECR_REGION" || true
      aws ecr put-image \
        --repository-name "$ECR_REPOSITORY_NAME" \
        --image-tag "$LATEST_TAG" \
        --image-manifest "$MANIFEST" \
        --region "$ECR_REGION"

      echo "Done: ${ECR_REPOSITORY}:${LATEST_TAG}"
