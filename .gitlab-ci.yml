# CI for code-indexer-internal (the cidx multi-pod / cluster-mode fork).
#
# Stages
#   test   smoke tests (mirrors the upstream GitHub CI) + advisory ruff lint.
#   build  Docker build + push of the cluster-mode server image to the shared
#          `gitlab-runner` ECR in the legacy tools account (601706661779) -- the
#          ECR home every tools-* image shares. The ArgoCD overlay
#          (cloud-engineering/k8s/tools/dev-platform/claude-code-indexer) pins a
#          `gitlab-runner:cidx-<version>-<sha>` tag produced here.
#
# Image push runs under the default runner's NATIVE 601 identity (no assume-role)
# -- the same path sandbox-mcp's "Deploy Docker" job uses. The `gitlab-runner`
# repo enforces IMMUTABLE tags, so the moving `cidx-tools-latest` tag is
# re-pointed via batch-get-image -> batch-delete-image -> put-image (a fresh
# create, which immutability allows), never a plain `docker push`.
#
# Submodules are skipped (GIT_SUBMODULE_STRATEGY: none): the image pulls its
# custom hnswlib from the git+https dependency declared in pyproject (the vendored
# third_party/hnswlib submodule is not COPYed into the image), and one fixture
# submodule uses an SSH URL that CI cannot fetch.

stages:
  - test
  - build

variables:
  GIT_SUBMODULE_STRATEGY: none
  ECR_REGION: "us-west-2"
  ECR_ACCOUNT_ID: "601706661779"
  ECR_REPOSITORY_NAME: "gitlab-runner"
  IMAGE_PREFIX: "cidx"
  LATEST_TAG: "cidx-tools-latest"
  # Tag prefix for the BuildKit multi-stage layer cache (see build:image).
  # Cache tags are unique per build -- the repo is IMMUTABLE, so a fixed cache
  # tag could never be re-exported -- and pruned to the newest one at the end
  # of each successful build.
  CACHE_TAG_PREFIX: "cidx-buildcache"

# One pipeline per change: merge-request pipelines, master branch pipelines, and
# manual web-triggered pipelines (to build a pre-merge branch image on demand) --
# never a duplicate branch pipeline while an MR is open.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"

# -- test ----------------------------------------------------------------------
smoke:
  stage: test
  tags: [default]
  image: python:3.11-slim-bookworm
  # A real PostgreSQL, because ~46 tests across four files are gated on
  # TEST_POSTGRES_DSN and have skipped on every pipeline since they were
  # written. They are the only coverage of the cluster-mode storage backends --
  # the code path production actually runs. Measured locally: without the DSN
  # 85 passed / 46 skipped; with it 131 passed / 0 skipped. The gate was hiding
  # working tests, not flaky ones.
  services:
    - name: public.ecr.aws/docker/library/postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_PASSWORD: ci
        POSTGRES_DB: cidx
  variables:
    PIP_NO_CACHE_DIR: "1"
    # psycopg arrives via the `cluster` extra already installed below.
    TEST_POSTGRES_DSN: "postgresql://postgres:ci@postgres:5432/cidx"
  before_script:
    # hnswlib + psycopg build from source; the git+https hnswlib dep needs git.
    - apt-get update && apt-get install -y --no-install-recommends build-essential cmake git pkg-config
    - python -m pip install --upgrade pip
    - pip install ".[dev,cluster,cohere]"
  script:
    # Same smoke subset the upstream GitHub CI runs (no live Postgres required),
    # plus the fork's own invariant guards.
    #
    # The git-seam guard is here because it only earns its keep in CI. It exists
    # to catch raw git calls that an upstream snapshot merge reintroduces --
    # precisely the moment nobody is running a local script -- and it was
    # previously referenced by no CI job, no pre-commit hook and no automation
    # script, while fast-automation.sh passes --ignore=tests/unit/server/. It
    # runs in seconds and build:image is already gated on this stage.
    #
    # MCP response serialization is in this list for the same reason as the
    # fleet-concurrency files: the datetime fix (#1642) is correct and has
    # three test files, none of which any CI job collected. A canary
    # comparison caught the pre-fix image failing query_audit_logs with
    # "Object of type datetime is not JSON serializable"; nothing would have
    # caught it coming back.
    #
    # BOTH CI jobs are curated allowlists: this one names files, and
    # build:image's in-image step runs tests/unit/xray/ plus six MCP files.
    # Anything not explicitly named is never COLLECTED -- so unlike a gated test
    # it does not even show up as a skip, and there is no number anywhere that
    # goes down when coverage is lost. The background-work audit's five changes
    # (leader gating, per-process budgets, pod-pull refresh, catch-up
    # single-flight, HNSW sweep gating) all merged green with none of their tests
    # ever collected. The block below closes that, and
    # tests/unit/ci/test_smoke_covers_fleet_invariants.py keeps it closed: it
    # derives the required set from what the tests IMPORT, so a new one is not
    # silently left out of this list.
    - >
      python -m pytest
      tests/unit/server/storage/test_factory.py
      tests/unit/server/mcp/test_protocol.py
      tests/unit/services/test_database_health_cluster.py
      tests/unit/server/test_git_seam_no_raw_subprocess.py
      tests/unit/server/test_no_unredacted_subprocess_streams.py
      tests/unit/server/storage/shared/test_git_backend_run_bytes_redaction.py
      tests/unit/utils/test_git_invoker.py
      tests/unit/utils/test_subprocess_diagnostics_1832.py
      tests/unit/xray/test_python_validator_nested_std_paths.py
      tests/unit/server/storage/postgres/test_xray_cache_backend.py
