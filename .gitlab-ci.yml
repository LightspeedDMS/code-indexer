# Real gate: ruff must be PINNED to the version the repo standardizes on
# (.pre-commit-config.yaml → v0.14.1). Unpinned `pip install ruff` drifts to
# whatever is latest, whose much broader default ruleset floods this vendored
# upstream snapshot with ~18k style/modernization nits (UP/FA/BLE/LOG…) — none of
# them in the repo's actual lint standard, and hand-fixing them would gratuitously
# diverge the fork from upstream. Against the pinned ruff the tree is clean, so
# (per the former TODO) this is now blocking rather than advisory.
lint:
  stage: test
  tags: [default]
  image: python:3.11-slim-bookworm
  before_script:
    - pip install ruff==0.14.1
  script:
    - ruff check src tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# -- build ---------------------------------------------------------------------
# Gated on `smoke` (later stage runs only if the test stage passed). Auto on
# master; manual on a web-triggered branch pipeline so we can cut an image from a
# feature branch (e.g. to point the ArgoCD test overlay at a pre-merge build).
build:image:
  stage: build
  tags: [default]
  image: public.ecr.aws/docker/library/docker:24
  services:
    - name: public.ecr.aws/docker/library/docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_BUILDKIT: "1"
  resource_group: docker-build/cidx
  timeout: 90m
  before_script:
    # --upgrade bumps expat to match python3.12's pyexpat: without it the alpine
    # aws-cli package fails with "XML_SetAllocTrackerActivationThreshold: symbol
    # not found" and get-login-password emits nothing (docker login then falls
    # back to an interactive prompt and errors). Matches sandbox-mcp's job.
    - apk add --no-cache --upgrade aws-cli jq
    - aws --version
    - until docker info >/dev/null 2>&1; do sleep 2; done
    # A buildx builder on the docker-container driver, NOT the default `docker`
    # driver. This is not a style preference: `--cache-to type=registry` is
    # rejected outright by the docker driver ("cache export is not supported"),
    # and registry cache is the only mechanism that carries the `builder` and
    # `xray-builder` stages (see the cache note in `script:`). buildx ships in
    # this image (verified: docker:24 -> buildx v0.16.2).
    #
    # The driver pulls moby/buildkit:buildx-stable-1 from Docker Hub into the
    # dind daemon. If that ever starts flaking on Hub's anonymous pull limits,
    # mirror that image into this same ECR and add
    # `--driver-opt image=<ecr>/<repo>:<buildkit-tag>` here.
    # The docker-container driver cannot read DOCKER_TLS_VERIFY/DOCKER_CERT_PATH
    # from the environment -- it fails with "could not create a builder instance
    # with TLS data loaded from environment" and tells you to make a context.
    # dind here is TLS-only (tcp://docker:2376 + /certs/client), so the context
    # is not optional. Built from the same variables the job already sets, so
    # there is no second copy of the endpoint to drift.
    - >
      docker context create cidx-dind
      --docker "host=${DOCKER_HOST},ca=${DOCKER_CERT_PATH}/ca.pem,cert=${DOCKER_CERT_PATH}/cert.pem,key=${DOCKER_CERT_PATH}/key.pem"
    - docker buildx create --name cidx-builder --driver docker-container --use cidx-dind
    - docker buildx inspect --bootstrap
  script:
    - |
      ECR_REPOSITORY="${ECR_ACCOUNT_ID}.dkr.ecr.${ECR_REGION}.amazonaws.com/${ECR_REPOSITORY_NAME}"
      aws ecr get-login-password --region "$ECR_REGION" \
        | docker login --username AWS --password-stdin "${ECR_ACCOUNT_ID}.dkr.ecr.${ECR_REGION}.amazonaws.com"

      VERSION=$(TZ=America/Denver date +"%Y.%m.%d.%H%M")
      SHORT_SHA=$(echo "$CI_COMMIT_SHORT_SHA" | cut -c1-7)
      if [ "$CI_COMMIT_BRANCH" = "master" ]; then
        # Matches the existing overlay convention: cidx-<YYYY.MM.DD.HHMM>-<sha>.
        IMAGE_TAG="${IMAGE_PREFIX}-${VERSION}-${SHORT_SHA}"
      else
        BRANCH_SAFE=$(echo "$CI_COMMIT_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | cut -c1-40)
        IMAGE_TAG="${IMAGE_PREFIX}-${BRANCH_SAFE}-${VERSION}-${SHORT_SHA}"
      fi
      FULL="${ECR_REPOSITORY}:${IMAGE_TAG}"

      # -- layer cache -------------------------------------------------------
      # The previous `--build-arg BUILDKIT_INLINE_CACHE=1 --cache-from <latest>`
      # cached NOTHING in the two stages that cost real time. Inline cache is
      # embedded in the pushed image's config, so it can only describe the
      # layers of the FINAL stage; the `builder` and `xray-builder` stages leave
      # no record. And because the final stage COPYs from `builder` before it
      # COPYs from `xray-builder`, any src/ commit misses on the first COPY,
      # which misses every later step in that stage, which forces xray-builder
      # to be materialized for real -- i.e. `cargo build --release -p xray-cli`
      # plus the ~20 tree-sitter grammar crates compiled from scratch on every
      # single build, inside a job already at timeout: 90m behind a
      # resource_group that serializes it.
      #
      # Measured on a reduced two-builder-stage reproduction of this exact
      # topology, both runs on a provably empty local BuildKit cache, one
      # single-file src change between seed and run:
      #   inline cache  : 0 cached steps, full rebuild of xray-builder (28s)
      #   registry max  : xray-builder fully CACHED, never executed (8s)
      # The stamps baked into the two images confirmed the xray steps were
      # restored rather than re-run.
      #
      # `mode=max` is the point: it exports every layer of every stage, not
      # just the final one. `image-manifest=true,oci-mediatypes=true` makes the
      # cache a single OCI image manifest, which is the shape ECR accepts (the
      # older multi-manifest cache format is not an ECR-supported artifact).
      #
      # Tagging: this ECR repo is IMMUTABLE, so the cache CANNOT be re-exported
      # to a fixed tag, and the delete-then-put-image trick used for
      # ${LATEST_TAG} below is not available either -- cache-from reads at the
      # start of the build and cache-to writes at the end, so there is no point
      # at which the tag could be freed. Instead every build writes a FRESH,
      # unique cache tag (always a create, which immutability allows), reads
      # the newest cache tag left by the previous build, and prunes the rest at
      # the end. Storage is therefore bounded at one cache manifest. Its layers
      # are content-addressed in the same repo, so layers it shares with the
      # pushed image are stored once; the extra is the intermediate-stage
      # layers (python builder site-packages, the cargo target dir), order of a
      # few GB -> low single-digit dollars/month at ECR's per-GB rate. If a
      # MUTABLE repo is ever available for build caches, this whole
      # discover/prune dance collapses to one fixed `--cache-to` tag.
      NEW_CACHE_TAG="${CACHE_TAG_PREFIX}-${VERSION}-${SHORT_SHA}"
      PREV_CACHE_TAG=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY_NAME" \
        --region "$ECR_REGION" \
        --query 'sort_by(imageDetails[?imageTags], &imagePushedAt)[*].imageTags[]' \
        --output text 2>/dev/null | tr '\t' '\n' | grep "^${CACHE_TAG_PREFIX}-" | tail -1 || true)

      CACHE_FROM="--cache-from type=registry,ref=${ECR_REPOSITORY}:${LATEST_TAG}"
      if [ -n "$PREV_CACHE_TAG" ]; then
        CACHE_FROM="--cache-from type=registry,ref=${ECR_REPOSITORY}:${PREV_CACHE_TAG} ${CACHE_FROM}"
        echo "Reusing build cache ${ECR_REPOSITORY}:${PREV_CACHE_TAG}"
      else
        echo "No ${CACHE_TAG_PREFIX}-* cache tag yet; this build seeds one."
      fi

      # Pre-delete covers a same-minute rerun of the same commit (immutable repo
      # accepts a fresh tag, not an overwrite). Must happen BEFORE the build now
      # that buildx pushes the image itself.
      aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY_NAME" \
        --image-ids imageTag="$IMAGE_TAG" --region "$ECR_REGION" || true
      aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY_NAME" \
        --image-ids imageTag="$NEW_CACHE_TAG" --region "$ECR_REGION" || true

      # --provenance=false --sbom=false: buildx attaches a provenance
      # attestation on --push by default, which turns the pushed artifact into
      # an OCI index instead of the plain single-platform image manifest that
      # `docker push` produced before. The ${LATEST_TAG} re-point below copies
      # that manifest verbatim via put-image, and the ArgoCD overlay consumes
      # it, so keep the artifact shape byte-for-byte what it has always been.
      # The content-backend plugin is installed from the evo-sandbox private PyPI
      # registry. Its index URL goes in as a BuildKit secret (never a build-arg,
      # which would land in the image history). Reading another project
      # registry with CI_JOB_TOKEN needs the evo-sandbox job-token allowlist to
      # include this project.
      export PLUGIN_INDEX_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/api/v4/projects/85492596/packages/pypi/simple"
      docker buildx build \
        --builder cidx-builder \
        --provenance=false --sbom=false \
        --secret id=plugin_index,env=PLUGIN_INDEX_URL \
        $CACHE_FROM \
        --cache-to "type=registry,ref=${ECR_REPOSITORY}:${NEW_CACHE_TAG},mode=max,image-manifest=true,oci-mediatypes=true" \
        -t "$FULL" --push .
      echo "Pushed $FULL"

      # -- run the tests that can ONLY run inside this image -----------------
      # Both test jobs above use python:3.11-slim-bookworm, which has no cargo
      # and no xray-cli, so every test gated on the real binary SKIPS in CI --
      # roughly 30 of them, on every pipeline, since the gate was written. A
      # suite that always skips is not coverage; it is a green tick with
      # nothing behind it, and it skipped silently right through the release
      # that shipped xray with no binary at all.
      #
      # This image is the first artifact that can run them: it carries xray-cli
      # AND the pinned toolchain, and sets CIDX_XRAY_CLI_PATH, so the gates
      # resolve to a real binary and the tests execute against the EXACT
      # artifact being shipped -- including the glibc it will run on in the pod.
      #
      # --user 0:0 because the image runs as `cidx` and pip needs to write;
      # the repo is mounted read-write only so pytest can place its cache.
      # CIDX_REQUIRE_XRAY_EXTRAS turns a missing optional dependency into a
      # failure here rather than another silent skip.
      # Fed over stdin as a QUOTED heredoc, not `sh -c '...'`. The quoted
      # form looks tidier and is a trap: an apostrophe anywhere in the body --
      # including inside a comment, e.g. "the image's own ENV" -- closes the
      # string, and everything after it then runs on the RUNNER instead of in
      # the container. That is exactly how this step failed twice, reporting
      # "/usr/bin/python: No module named pip" from the Alpine runner and
      # looking convincingly like an interpreter-resolution problem.
      # <<'EOF' quoting also stops the runner expanding anything inside.
      docker run --rm --user 0:0 -i \
        -v "$CI_PROJECT_DIR:/w" -w /w \
        -e CIDX_REQUIRE_XRAY_EXTRAS=1 \
        "$FULL" sh -s <<'IN_IMAGE_VERIFY'
      set -e
      # No PYTHONPATH=/w/src: the repo is mounted for the TEST files, but
      # code_indexer must resolve from site-packages so this exercises the code
      # that actually ships. Pointing at the mount tested the working tree, and
      # the bind mount import overhead also pushed `cidx --help` from ~1.0s to
      # ~1.7s, intermittently tripping the 2s startup assertion.
      # The shipped image must carry the content-backend plugin, or
      # content_backend=delegated fails at runtime. The Dockerfile only skips it
      # when the build secret is absent, which CI never does -- assert it.
      python -c "from importlib.metadata import entry_points; eps = [e.value for e in entry_points(group='code_indexer.content_backend')]; assert eps == ['cidx_content_backend:make_content_backend'], eps; print('content backend plugin:', eps)"
      python -c "from importlib.metadata import entry_points; eps = [e.value for e in entry_points(group='code_indexer.ripgrep_backend')]; assert eps == ['cidx_content_backend.ripgrep:make_ripgrep_backend'], eps; print('ripgrep backend plugin:', eps)"
      python -c "from importlib.metadata import entry_points; eps = [e.value for e in entry_points(group='code_indexer.index_artifacts')]; assert eps == ['cidx_content_backend.index_artifacts:make_index_artifacts'], eps; print('index artifacts plugin:', eps)"
      python -c "from importlib.metadata import entry_points; eps = [e.value for e in entry_points(group='code_indexer.content_writer')]; assert eps == ['cidx_content_backend.content_writer:make_content_writer'], eps; print('content writer plugin:', eps)"
      python -c "from importlib.metadata import entry_points; eps = [e.value for e in entry_points(group='code_indexer.xray_backend')]; assert eps == ['cidx_content_backend.xray:make_xray_backend'], eps; print('xray backend plugin:', eps)"
      python -c "from importlib.metadata import entry_points; eps = [e.value for e in entry_points(group='code_indexer.scip_backend')]; assert eps == ['cidx_content_backend.scip:make_scip_backend'], eps; print('scip backend plugin:', eps)"
      python -m pip install --quiet --no-input pytest pytest-asyncio pytest-timeout
      python -m pytest \
        tests/unit/xray/ \
        tests/unit/server/mcp/test_analyze_graph_handler.py \
        tests/unit/server/mcp/test_analyze_graph_multi_repo_1902.py \
        tests/unit/server/mcp/test_analyze_graph_refine_1909.py \
        tests/unit/server/mcp/test_xray_graph_pattern_modes_1859_1860.py \
        tests/unit/server/mcp/test_xray_graph_excluded_extractor_honesty_1907.py \
        tests/unit/server/mcp/test_xray_missing_binary_honesty.py \
        -q -p no:randomly --timeout=600
      IN_IMAGE_VERIFY
      echo "In-image xray verification passed for $FULL"

      # Keep exactly the cache tag this build just wrote.
      for STALE in $(aws ecr describe-images --repository-name "$ECR_REPOSITORY_NAME" \
            --region "$ECR_REGION" --query 'imageDetails[?imageTags].imageTags[]' \
            --output text 2>/dev/null | tr '\t' '\n' \
            | grep "^${CACHE_TAG_PREFIX}-" | grep -v "^${NEW_CACHE_TAG}$"); do
        aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY_NAME" \
          --image-ids imageTag="$STALE" --region "$ECR_REGION" || true
        echo "Pruned stale build cache tag $STALE"
      done

      # Re-point the moving latest by manifest copy (immutable tag -> put-image),
      # master builds only.
      if [ "$CI_COMMIT_BRANCH" = "master" ]; then
        MANIFEST=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY_NAME" \
          --image-ids imageTag="$IMAGE_TAG" --region "$ECR_REGION" \
          --query 'images[0].imageManifest' --output text)
        aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY_NAME" \
          --image-ids imageTag="$LATEST_TAG" --region "$ECR_REGION" || true
        aws ecr put-image --repository-name "$ECR_REPOSITORY_NAME" \
          --image-tag "$LATEST_TAG" --image-manifest "$MANIFEST" --region "$ECR_REGION"
        echo "Re-pointed ${ECR_REPOSITORY}:${LATEST_TAG} -> $IMAGE_TAG"
      fi

      # Publish the tag so it is visible in the job log and consumable by a
      # downstream ArgoCD-overlay bump (dotenv artifact).
      echo "IMAGE_TAG=$IMAGE_TAG" > image.env
      echo "Overlay image ref: ${ECR_REPOSITORY}:${IMAGE_TAG}"
  artifacts:
    reports:
      dotenv: image.env
    paths:
      - image.env
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
