# Managed by install-cidx-server.sh and the cidx auto-updater; local edits are overwritten.
# Cores up to 16G are stored whole. MaxUse/KeepFree are cleanup targets (old cores are removed
# toward them after a store), not hard caps. systemd-coredump reads this file at every crash; no reload.
[Coredump]
Storage=external
ProcessSizeMax=16G
ExternalSizeMax=16G
MaxUse=20G
KeepFree=10G
