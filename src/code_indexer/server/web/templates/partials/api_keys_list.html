{% if api_keys %}
<table role="grid">
    <thead>
        <tr>
            <th>Name</th>
            <th>Key Prefix</th>
            <th>Created</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for key in api_keys %}
        <tr>
            <td>{{ key.name or '(unnamed)' }}</td>
            <td><code>{{ key.key_prefix }}...</code></td>
            <td>{{ (key.created_at|string)[:10] }}</td>
            <td>
                <button class="outline secondary" data-key-id="{{ key.key_id }}" data-key-name="{{ key.name or '' }}" onclick="deleteKey(this.dataset.keyId, this.dataset.keyName)">
                    Delete
                </button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>No API keys found. Click "Generate New Key" to create one.</p>
{% endif %}
