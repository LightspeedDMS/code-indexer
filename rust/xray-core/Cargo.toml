[package]
name = "xray-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "xray_core"
path = "src/lib.rs"

[dependencies]
tree-sitter = "0.25"
tree-sitter-java = "0.23.5"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-bash = "0.25.1"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
rayon = "1"
walkdir = "2"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
sha2 = "0.10"
libloading = "0.8"
tree-sitter-hcl = "1.1.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-xml = "0.7.0"
tree-sitter-groovy = "0.1.2"
tree-sitter-sequel-tsql = "0.4.2"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tempfile = "3"
# Story #1787 S2 AC7: mmap-based --graph-in handoff to the killable analyze
# child process. Safe wrapper over mmap(2)/munmap(2) -- avoids hand-rolled
# unsafe syscall plumbing for the file-backed read side.
memmap2 = "0.9"
# Story #1787 S2 AC7: process-group SIGKILL (killpg) for the analyze child --
# std::process::Child::kill() only signals the single pid, not its group, so
# a hung analyze child (or anything it spawned) needs libc::kill(-pgid, ...).
libc = "0.2"
# Story #1787 S2 AC7: JSON protocol between the analyze child process and
# its parent (AnalyzeStatus + GraphResult over stdout) -- reuses the same
# serde/serde_json xray-cli already depends on rather than hand-rolling a
# second ad hoc encoder.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Bug #1791: exposes the `#[cfg(any(test, feature = "test-support"))]`
# OwnedNode test constructors (new_leaf_for_test / new_node_for_test) to
# `tests/*.rs` integration-test crates. Plain `#[cfg(test)]` only applies
# when THIS crate is compiled as its own unit-test binary -- an integration
# test links against a normal (non-cfg-test) build of the library, so it
# cannot otherwise reach them. Never enabled for a production/release build:
# only the self-referencing dev-dependency below turns it on, and per
# Cargo's resolver = "2" semantics (see workspace Cargo.toml) dev-dependency
# features never leak into a build of this crate consumed by another crate
# (e.g. xray-cli).
test-support = []

[dev-dependencies]
xray-core = { path = ".", features = ["test-support"] }
